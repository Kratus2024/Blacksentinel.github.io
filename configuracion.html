<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Configuración - BlackSentinel</title>
  <link rel="stylesheet" href="css/modulos.css">
</head>
<body>
  <div class="config-container">
    <h1>⚙️ Configuración de Usuario</h1>
    <form id="configForm">
      <label>Nombre</label>
      <input type="text" id="nombre" placeholder="Tu nombre">

      <label>Correo</label>
      <input type="email" id="correo" placeholder="usuario@blacksentinel.com">

      <label>Contraseña</label>
      <input type="password" id="password" placeholder="********">

      <label>Idioma</label>
      <select id="idioma">
        <option>Español</option>
        <option>Inglés</option>
      </select>

      <label>Tema</label>
      <select id="tema">
        <option>Oscuro</option>
        <option>Claro</option>
      </select>

      <button type="submit">Guardar cambios</button>
    </form>
    <button class="btn-regresar" onclick="window.history.back()">⬅️ Regresar</button>

  </div>
  <script src="backend/configuracion.js"></script>
</body>
</html>
